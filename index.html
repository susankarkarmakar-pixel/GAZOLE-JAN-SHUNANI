<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Grievance Submission</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Site Grievance Form</h2>
        
        <form id="grievanceForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" name="name" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Phone</label>
                <input type="tel" name="phone" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Description</label>
                <textarea name="description" rows="3" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>

            <!-- Camera Section -->
            <div class="border-t pt-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Site Photo / Supporting Documents</label>
                
                <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
                
                <div class="flex gap-2 mb-2">
                    <button type="button" id="openCameraBtn" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                        📷 Open Camera
                    </button>
                    <button type="button" id="uploadGalleryBtn" class="flex-1 bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700 transition font-medium">
                        📁 Gallery
                    </button>
                </div>

                <!-- Live Camera Modal -->
                <div id="cameraModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex flex-col items-center justify-center p-4">
                    <video id="video" autoplay playsinline class="w-full max-w-md rounded-lg bg-black border-2 border-white"></video>
                    <div class="mt-6 flex gap-4">
                        <button type="button" id="captureBtn" class="bg-green-600 text-white py-3 px-8 rounded-full text-lg font-bold shadow-lg">Capture</button>
                        <button type="button" id="closeCameraBtn" class="bg-red-600 text-white py-3 px-8 rounded-full text-lg font-bold shadow-lg">Cancel</button>
                    </div>
                </div>

                <canvas id="canvas" class="hidden"></canvas>

                <!-- Image Preview -->
                <div id="imagePreviewContainer" class="hidden mt-3 relative">
                    <img id="imagePreview" class="w-full h-56 object-cover rounded-md border border-gray-300 shadow-sm">
                    <button type="button" id="retakeBtn" class="absolute top-2 right-2 bg-red-500 text-white text-xs px-3 py-1 rounded-full shadow">Retake</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-3 px-4 rounded-md font-bold hover:bg-green-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                Submit Grievance
            </button>
            <p id="statusMessage" class="text-center text-sm mt-2 font-medium"></p>
        </form>
    </div>

    <script>
        // আপনার GAS Web App URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwRYQM6RX-9PAwkFbhgUgpwan4RmDwTfaIyC0i-Q8MScOsUBPEbX1H7lsdJT68OI-eBxw/exec";
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const cameraModal = document.getElementById('cameraModal');
        const imagePreview = document.getElementById('imagePreview');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const fileInput = document.getElementById('fileInput');
        let stream = null;
        let capturedImageBase64 = null;

        // 1. Open Live Camera
        document.getElementById('openCameraBtn').addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } // Rear camera preference
                });
                video.srcObject = stream;
                cameraModal.classList.remove('hidden');
            } catch (err) {
                alert("Camera access denied or not available. Please use 'Gallery' button.");
                console.error(err);
            }
        });

        // 2. Close Camera
        document.getElementById('closeCameraBtn').addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            cameraModal.classList.add('hidden');
        });

        // 3. Capture Photo
        document.getElementById('captureBtn').addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.8); // Compress to 80%
            
            imagePreview.src = capturedImageBase64;
            imagePreviewContainer.classList.remove('hidden');
            
            if (stream) stream.getTracks().forEach(track => track.stop());
            cameraModal.classList.add('hidden');
        });

        // 4. Retake Photo
        document.getElementById('retakeBtn').addEventListener('click', () => {
            capturedImageBase64 = null;
            imagePreviewContainer.classList.add('hidden');
            fileInput.value = "";
        });

        // 5. Upload from Gallery (Fallback for mobile)
        document.getElementById('uploadGalleryBtn').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    capturedImageBase64 = event.target.result;
                    imagePreview.src = capturedImageBase64;
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 6. Form Submission to GAS
        document.getElementById('grievanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            if (!capturedImageBase64) {
                alert("Please capture or upload a site photo first.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            statusMessage.innerText = "";

            const formData = {
                name: e.target.name.value,
                phone: e.target.phone.value,
                description: e.target.description.value,
                imageBase64: capturedImageBase64,
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(formData) // Sending as JSON string
                });
                
                const result = await response.json();
                if (result.result === "success") {
                    statusMessage.innerText = "✅ Submitted Successfully!";
                    statusMessage.className = "text-center text-sm mt-2 font-medium text-green-600";
                    e.target.reset();
                    capturedImageBase64 = null;
                    imagePreviewContainer.classList.add('hidden');
                    fileInput.value = "";
                } else {
                    throw new Error(result.message || "Unknown error");
                }
            } catch (error) {
                console.error("Submission error:", error);
                statusMessage.innerText = "❌ Submission failed. Check console.";
                statusMessage.className = "text-center text-sm mt-2 font-medium text-red-600";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Grievance";
            }
        });
    </script>
</body>
</html>
